syntax = "proto3";

package bread;

option go_package = "github.com/calvarado2004/bakery-go/proto";

import "google/protobuf/timestamp.proto";

message Bread {
    int32 id = 1;
    string name = 2;
    double price = 3;
    int32 quantity = 4;
    string description = 5;
    string type = 6;
    string status = 7;
    google.protobuf.Timestamp created_at = 8;
    google.protobuf.Timestamp updated_at = 9;
    string image = 10;
}

message BuyOrderItem {
  int32 breadId = 1;
  int32 quantityRequested = 2;
  int32 quantityFulfilled = 3;
  double bidPrice = 4;
  string status = 5; // "pending" | "fulfilled" | "partially_fulfilled" | "skipped" | "rejected"
}

message BuyOrder {
  int32 id = 1;
  int32 customerId = 2;
  string buyOrderUuid = 3;
  double totalCost = 4;
  string status = 5;
  int64 sequenceNumber = 6;
  double bidPrice = 7;
  bool allowPartial = 8;
  bool skipUnavailableItems = 9;
  google.protobuf.Timestamp created_at = 10;
  repeated BuyOrderItem items = 11;
}

message BuyOrderDetails {
  int32 buyOrderId = 1;
  string buyOrderUuid = 6;
  int32 breadId = 2;
  int32 quantity = 3;
  double price = 4;
  string status = 5;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message BuyOrderList {
  repeated BuyOrder buyOrders = 1;
  repeated BuyOrderDetails buyOrderDetails = 2;
}

message BuyOrderRequest {
  BuyOrderList buyOrders = 3;
  string buy_order_uuid = 2;
}

message BuyOrderResponse {
  string message = 1;
  BuyOrderList buyOrders = 3;
  string error = 4;
}

message MakeOrder {
  int32 id = 1;
  int32 breadMakerId = 2;
}

message MakeOrderDetails {
  int32 makeOrderId = 1;
  int32 breadId = 2;
  int32 quantity = 3;
  double price = 4;
  string status = 5;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message BreadList {
    repeated Bread breads = 1;
}

// BuyOrderPreferences lets the buyer specify matching engine rules.
message BuyOrderPreferences {
    double bidPrice = 1;               // price per unit the buyer is willing to pay
    bool allowPartial = 2;             // allow partial fulfillment of the entire order
    bool skipUnavailableItems = 3;     // skip items with zero stock instead of failing the order
}

message BreadRequest {
    BreadList breads = 3;
    string buy_order_uuid = 2;
    string make_order_uuid = 4;
    BuyOrderPreferences preferences = 5;
}

message BreadResponse {
    string message = 1;
    BreadList breads = 3;
    string error = 4;
    int32 buy_order_id = 5;
    int32 make_order_id = 6;
    string buy_order_uuid = 7;
    string make_order_uuid = 8;
}

service MakeBread {

    rpc BakeBread(BreadRequest) returns (BreadResponse) {

    }

    rpc SendBreadToBakery(BreadRequest) returns (BreadResponse) {

    }

    rpc MadeBreadStream(BreadRequest) returns (stream BreadResponse) {

    }
}

service CheckInventory {

    rpc CheckBreadInventory(BreadRequest) returns (BreadResponse) {

    }

    rpc CheckBreadInventoryStream(BreadRequest) returns (stream BreadResponse) {


    }

}

service BuyBread {

      rpc BuyBread(BreadRequest) returns (BreadResponse) {

      }

      rpc BuyBreadStream(BreadRequest) returns (stream BreadResponse) {

      }

}

service BuyOrderService {

      rpc BuyOrder(BuyOrderRequest) returns (BuyOrderResponse) {

      }

      rpc BuyOrderStream(BuyOrderRequest) returns (stream BuyOrderResponse) {

      }

}

service RemoveOldBread {

      rpc RemoveBread(BreadRequest) returns (BreadResponse) {

      }

      rpc RemoveBreadStream(BreadRequest) returns (stream BreadResponse) {

      }

}

service MakeOrderService {

      rpc MakeOrder(BreadRequest) returns (BreadResponse) {

      }

      rpc MakeOrderStream(BreadRequest) returns (stream BreadResponse) {

      }

}

// Admin Service messages
message Empty {}

message DashboardStats {
  int32 totalOrders = 1;
  double totalRevenue = 2;
  int32 totalProducts = 3;
  int32 totalCustomers = 4;
  int32 totalBreadMakers = 5;
  int32 lowStockCount = 6;
}

message Customer {
  int32 id = 1;
  string name = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message CustomerList {
  repeated Customer customers = 1;
}

message BreadMakerProto {
  int32 id = 1;
  string name = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}

message BreadMakerList {
  repeated BreadMakerProto breadMakers = 1;
}

message CreateBreadRequest {
  string name = 1;
  double price = 2;
  int32 quantity = 3;
  string description = 4;
  string type = 5;
  string image = 6;
}

message UpdateBreadRequest {
  int32 id = 1;
  string name = 2;
  double price = 3;
  int32 quantity = 4;
  string description = 5;
  string type = 6;
  string image = 7;
}

message DeleteBreadRequest {
  int32 id = 1;
}

message UpdateOrderStatusRequest {
  string buyOrderUuid = 1;
  string status = 2;
}

message BreadIdRequest {
  int32 id = 1;
}

message CustomerIdRequest {
  int32 id = 1;
}

message BreadMakerIdRequest {
  int32 id = 1;
}

message CustomerOrdersResponse {
  Customer customer = 1;
  repeated BuyOrder orders = 2;
}

message MakerOrdersResponse {
  BreadMakerProto maker = 1;
  repeated MakeOrderProto orders = 2;
}

message MakeOrderProto {
  int32 id = 1;
  int32 breadMakerId = 2;
  string makeOrderUuid = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  repeated Bread breads = 6;
}

message MakeOrderList {
  repeated MakeOrderProto makeOrders = 1;
}

// Admin Service
service AdminService {
  rpc GetDashboardStats(Empty) returns (DashboardStats);
  rpc GetAllCustomers(Empty) returns (CustomerList);
  rpc GetAllBreadMakers(Empty) returns (BreadMakerList);
  rpc GetAllBread(Empty) returns (BreadList);
  rpc GetBreadById(BreadIdRequest) returns (Bread);
  rpc CreateBread(CreateBreadRequest) returns (Bread);
  rpc UpdateBread(UpdateBreadRequest) returns (Bread);
  rpc DeleteBread(DeleteBreadRequest) returns (Empty);
  rpc GetLowStockAlerts(Empty) returns (BreadList);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (BuyOrder);
  rpc GetCustomerOrders(CustomerIdRequest) returns (CustomerOrdersResponse);
  rpc GetMakerOrders(BreadMakerIdRequest) returns (MakerOrdersResponse);
  rpc GetAllOrders(Empty) returns (BuyOrderList);
  rpc GetAllMakeOrders(Empty) returns (MakeOrderList);
}

// Authentication messages
message AdminUser {
  int32 id = 1;
  string username = 2;
  string email = 3;
  string role = 4;
  google.protobuf.Timestamp created_at = 5;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string token = 2;
  string message = 3;
  AdminUser user = 4;
}

message CustomerLoginRequest {
  string email = 1;
  string password = 2;
}

message CustomerLoginResponse {
  bool success = 1;
  string token = 2;
  string message = 3;
  Customer customer = 4;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string userId = 2;
  string userType = 3;
}

// Invoice messages
message Invoice {
  int32 id = 1;
  int32 buyOrderId = 2;
  int32 customerId = 3;
  string invoiceNumber = 4;
  double subtotal = 5;
  double tax = 6;
  double total = 7;
  string status = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp due_date = 10;
  google.protobuf.Timestamp paid_at = 11;
  repeated InvoiceItem items = 12;
}

message InvoiceItem {
  int32 id = 1;
  int32 invoiceId = 2;
  int32 breadId = 3;
  string breadName = 4;
  int32 quantity = 5;
  double unitPrice = 6;
  double total = 7;
}

message InvoiceList {
  repeated Invoice invoices = 1;
}

message CreateInvoiceRequest {
  int32 buyOrderId = 1;
}

message InvoiceIdRequest {
  int32 id = 1;
}

message CustomerInvoicesRequest {
  int32 customerId = 1;
}

// Auth Service
service AuthService {
  rpc AdminLogin(LoginRequest) returns (LoginResponse);
  rpc CustomerLogin(CustomerLoginRequest) returns (CustomerLoginResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc CreateAdminUser(CreateAdminUserRequest) returns (AdminUser);
}

message CreateAdminUserRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string role = 4;
}

// Invoice Service
service InvoiceService {
  rpc CreateInvoice(CreateInvoiceRequest) returns (Invoice);
  rpc GetInvoice(InvoiceIdRequest) returns (Invoice);
  rpc GetCustomerInvoices(CustomerInvoicesRequest) returns (InvoiceList);
  rpc GetAllInvoices(Empty) returns (InvoiceList);
}

// Customer Portal Service
service CustomerPortalService {
  rpc GetMyOrders(CustomerIdRequest) returns (CustomerOrdersResponse);
  rpc GetMyInvoices(CustomerIdRequest) returns (InvoiceList);
  rpc GetOrderDetails(BuyOrderIdRequest) returns (BuyOrderDetailsResponse);
}

message BuyOrderIdRequest {
  int32 id = 1;
}

message BuyOrderDetailsResponse {
  BuyOrder order = 1;
  repeated BuyOrderDetails details = 2;
  double totalCost = 3;
}

// ──────────────────────────────────────────────────────────────────
// BrokerService — the ONLY way the broker communicates data operations
// to the server. The broker has ZERO direct database access.
// ──────────────────────────────────────────────────────────────────

// BrokerOrderResult is returned by ReportOrder when the server accepts
// a new order from the broker (after dedup check and DB insert).
message BrokerOrderResult {
  bool accepted = 1;          // false if UUID already exists (duplicate)
  int32 orderId = 2;          // the order ID assigned by the server
  string message = 3;         // "accepted" or "duplicate"
}

// ReserveInventoryRequest is used by the broker to reserve stock for
// a single item within a batch match. The server atomically checks
// stock and deducts in one SELECT FOR UPDATE transaction.
message ReserveInventoryRequest {
  int32 breadId = 1;
  int32 quantityRequested = 2;
  string buyOrderUuid = 3;    // for logging/tracking
}

// ReserveInventoryResult reports whether stock was reserved and how
// much was actually fulfilled (for partial fulfillment support).
message ReserveInventoryResult {
  bool reserved = 1;          // true if stock was available
  int32 quantityFulfilled = 2; // actual quantity deducted (may be less)
  string message = 3;         // "reserved" or "insufficient_stock"
}

// MatchingItemResult is one item within a batch of matching results.
message MatchingItemResult {
  int32 breadId = 1;
  int32 quantityRequested = 2;
  int32 quantityFulfilled = 3;
  string status = 4;          // "fulfilled" | "partially_fulfilled" | "skipped" | "rejected"
}

// MatchingBatchResult is the complete result of a matching batch,
// reported by the broker to the server so the server can update
// the database and the outbox atomically.
message MatchingBatchResult {
  string buyOrderUuid = 1;
  string orderStatus = 2;     // "processed" | "partially_processed" | "rejected" | "failed"
  repeated MatchingItemResult items = 3;
  double totalCost = 4;
}

// MatchingBatch is a batch of results from the broker's matching engine.
// The broker reports ALL matched orders in one call to avoid per-order
// gRPC overhead during high-throughput matching.
message MatchingBatch {
  repeated MatchingBatchResult results = 1;
}

// BatchConfirmation confirms the server has persisted the matching
// results to the database and the outbox.
message BatchConfirmation {
  bool accepted = 1;
  int32 ordersProcessed = 2;
  string message = 3;
}

// BrokerService is the server-side interface the broker uses for ALL
// data operations. The broker connects to the server's gRPC port and
// calls these methods instead of accessing PostgreSQL directly.
//
// Flow:
//   1. Broker consumes order from RabbitMQ → calls ReportOrder
//      Server: checks UUID dedup → inserts into DB → returns order ID
//   2. Broker buffers orders for batch matching
//   3. For each item in batch: calls ReserveInventory
//      Server: atomic SELECT FOR UPDATE + deduct stock → returns result
//   4. After batch complete: calls ReportMatchingResults
//      Server: updates order status + writes to outbox (DB tx)
//   5. Server's outbox publisher → publishes to bread-bought queue
//   6. Server's settlement dispatcher → streams to buyers
service BrokerService {
  // ReportOrder notifies the server of a new order consumed from
  // RabbitMQ. The server handles deduplication and persistence.
  rpc ReportOrder(BuyOrder) returns (BrokerOrderResult);

  // ReserveInventory atomically checks and deducts stock for one
  // item in a matching batch. This is the broker's replacement for
  // direct FulfillOrderItem DB calls.
  rpc ReserveInventory(ReserveInventoryRequest) returns (ReserveInventoryResult);

  // ReportMatchingResults sends the complete batch matching results
  // to the server. The server updates order statuses and writes
  // results to the outbox in a single transaction.
  rpc ReportMatchingResults(MatchingBatch) returns (BatchConfirmation);
}
