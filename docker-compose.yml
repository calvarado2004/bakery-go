services:
  # PostgreSQL database
  postgres:
    image: postgres:18-alpine
    container_name: bakery-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bakery
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./bakery.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed-dev.sql:/docker-entrypoint-initdb.d/02-seed-dev.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bakery"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bakery-network

  # RabbitMQ message broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bakery-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bakery-network

  # gRPC Server - main bakery service
  server:
    build:
      context: .
      dockerfile: server.dockerfile
    container_name: bakery-server
    environment:
      BAKERY_SERVICE_ADDR: 0.0.0.0:50051
      RABBITMQ_SERVICE_ADDR: amqp://guest:guest@rabbitmq:5672/
      DSN: postgres://postgres:password@postgres:5432/bakery?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-in-production}
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z 0.0.0.0 50051"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bakery-network

  # Broker - processes buy orders from RabbitMQ
  #
  # SINGLE-INSTANCE CONSTRAINT: The matching engine runs as a single instance.
  # Horizontal scaling requires hash-partitioning by buy_order_uuid so orders
  # for the same buyer always go to the same broker. Until that is implemented,
  # do NOT run multiple broker replicas.
  # See: ARCHITECTURE_AUDIT.md §9.3 and §10 (Phase 2).
  broker:
    build:
      context: .
      dockerfile: broker.dockerfile
    container_name: bakery-broker
    environment:
      RABBITMQ_SERVICE_ADDR: amqp://guest:guest@rabbitmq:5672/
      DSN: postgres://postgres:password@postgres:5432/bakery?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bakery-network

  # Makers - restocks bread inventory from RabbitMQ
  makers:
    build:
      context: .
      dockerfile: makers.dockerfile
    container_name: bakery-makers
    environment:
      RABBITMQ_SERVICE_ADDR: amqp://guest:guest@rabbitmq:5672/
      DSN: postgres://postgres:password@postgres:5432/bakery?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bakery-network

  # Buyers - gRPC client for purchasing bread
  buyers:
    build:
      context: .
      dockerfile: buyers.dockerfile
    container_name: bakery-buyers
    environment:
      BAKERY_SERVICE_ADDR: server:50051
      RABBITMQ_SERVICE_ADDR: amqp://guest:guest@rabbitmq:5672/
      DSN: postgres://postgres:password@postgres:5432/bakery?sslmode=disable
    depends_on:
      server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - bakery-network

  # Frontend - HTTP web interface
  frontend:
    build:
      context: .
      dockerfile: frontend.dockerfile
    container_name: bakery-frontend
    environment:
      BAKERY_SERVICE_ADDR: server:50051
      JWT_SECRET: ${JWT_SECRET:-change-in-production}
      CSRF_KEY: ${CSRF_KEY:-change-in-production}
    ports:
      - "8080:8080"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - bakery-network

networks:
  bakery-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
