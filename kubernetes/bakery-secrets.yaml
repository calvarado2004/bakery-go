# bakery-go secrets for Kubernetes deployment
# Generate with:
#   openssl rand -hex 32 > jwt-secret
#   openssl rand -hex 32 > csrf-key
apiVersion: v1
kind: Secret
metadata:
  name: bakery-secrets
  labels:
    app: bakery-service
type: Opaque
stringData:
  # JWT signing secret — REQUIRED.
  # Generate with: openssl rand -hex 32
  # The server and frontend will refuse to start if this is not set.
  JWT_SECRET: "change-me-in-production"
  # CSRF protection key — REQUIRED for the frontend.
  # Generate with: openssl rand -hex 32
  # The frontend will refuse to start if this is not set.
  CSRF_KEY: "change-me-in-production"
