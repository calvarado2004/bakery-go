# Server — foundation of the platform (Phase 10)
# Only service with PostgreSQL access. All other services communicate via gRPC.
# Includes: gRPC rate limiting, circuit breaker, RBAC (Phase 10.10).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bakery-server
  labels:
    app: bakery-server
    phase: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bakery-server
  template:
    metadata:
      labels:
        app: bakery-server
    spec:
      containers:
        - name: bakery-server
          image: docker.io/calvarado2004/bakery-go-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
              protocol: TCP
              name: grpc
          env:
            - name: BAKERY_SERVICE_ADDR
              value: "0.0.0.0:50051"
            - name: RABBITMQ_SERVICE_ADDR
              value: "amqp://guest:guest@rabbitmq-service:5672/"
            - name: DSN
              value: "host=postgres-service port=5432 user=postgres password=postgres dbname=bakery sslmode=disable timezone=UTC connect_timeout=5"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bakery-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bakery-server-service
  labels:
    app: bakery-server
spec:
  ports:
    - port: 50051
      protocol: TCP
      name: grpc
  selector:
    app: bakery-server
